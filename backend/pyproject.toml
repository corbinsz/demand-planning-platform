[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["app", "tests", "seed.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "B904"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
packages = ["app"]
check_untyped_defs = true

[tool.coverage.run]
source = ["app"]
branch = false
# Starlette's test client runs the app on a worker thread, and SQLAlchemy
# async uses greenlets. The default sys.monitoring core under-counts that.
core = "ctrace"
concurrency = ["thread", "greenlet"]
